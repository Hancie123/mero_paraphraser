line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # long lines: the formatter wraps code; long strings and regexes stay as written
  "E741",  # short names like `l` are used deliberately in tight loops
  "B023",  # every closure built in a loop here is passed to re.sub and called in the same iteration
  "B905",  # zip(strict=) would turn harmless length mismatches into crashes
]

[lint.per-file-ignores]
# Tests and tools add the engine to sys.path before importing it.
"tests/*" = ["E402"]
"tools/*" = ["E402"]
